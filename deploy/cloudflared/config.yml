# Cloudflare Tunnel 配置（named tunnel: fireflyiv）
# 0. 前置：cloudflared tunnel login && cloudflared tunnel create fireflyiv
# 1. 路由：cloudflared tunnel route dns fireflyiv www.fireflyiv.com
# 2. 运行：cloudflared tunnel --config config.yml run fireflyiv
# 3. 守护：复制 cloudflared.service 到 /etc/systemd/system/ 并启用

tunnel: fireflyiv
credentials-file: /etc/cloudflared/fireflyiv.json

ingress:
  # 博客主站（容器端口映射：主机 8082 -> 容器 3000）
  - hostname: www.fireflyiv.com
    service: http://127.0.0.1:8082
  # Artalk 评论服务（可选，独立子域）
  # - hostname: talk.fireflyiv.com
  #   service: http://127.0.0.1:1234
  # 兜底：拒绝其余流量
  - service: http_status:404