# FireflyIv Blog 部署编排
# 用法：在 deploy/ 目录执行 docker compose up -d --build
# 说明：web 构建上下文为代码根目录（..），artalk 直接拉官方镜像
# 镜像策略：第三方镜像按 sha256 摘要固定（2026-09-01 快照，与服务器现网一致），升级时替换摘要即可；web 由源码构建。
services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        NEXT_PUBLIC_ARTALK_SERVER: ${NEXT_PUBLIC_ARTALK_SERVER:-https://talk.fireflyiv.com}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    container_name: fireflyiv-web
    restart: unless-stopped
    # 只绑 127.0.0.1：公网入口完全交给 cloudflared 隧道
    ports:
      - "127.0.0.1:8082:3000"
    # 资源上限：4G 小主机上防止单容器拖垮整机
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SITE_URL=https://www.fireflyiv.com
      - CHATTER_TOKEN=${CHATTER_TOKEN:-change-me-to-a-long-random-string}
      - NEXT_PUBLIC_ARTALK_SERVER=${NEXT_PUBLIC_ARTALK_SERVER:-https://talk.fireflyiv.com}
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - UMAMI_PG_URL=${UMAMI_PG_URL:-}
      - UMAMI_WEBSITE_ID=bbfbe70a-b862-4e6b-b1f1-b369a6cbacec
      - SMTP_HOST=smtp.qq.com
      - SMTP_USER=firefly1v@qq.com
      - SMTP_PASS=${SMTP_PASS:-}
      - FRIEND_NOTIFY_TO=${FRIEND_NOTIFY_TO:-firefly1v@qq.com}
    volumes:
      - fireflyiv-data:/app/data

  artalk:
    # artalk-go 2.x（2026-09-01 固定摘要；升级见 deploy/README.md「月度升级」）
    image: artalk/artalk-go@sha256:ed51450f3ed744780efd0d796f1ea033063bb11543973439b9c57ed32ac9b78f
    container_name: fireflyiv-artalk
    restart: unless-stopped
    ports:
      - "127.0.0.1:1234:23366"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - fireflyiv-artalk:/data

volumes:
  fireflyiv-data:
  fireflyiv-artalk:
