# Uptime Kuma 状态监控（uptime-kuma.fireflyiv.com → 127.0.0.1:3001）
# 镜像按 sha256 摘要固定（2026-09-01 快照，与服务器现网一致）；升级时替换摘要。
services:
  kuma:
    image: louislam/uptime-kuma@sha256:3d632903e6af34139a37f18055c4f1bfd9b7205ae1138f1e5e8940ddc1d176f9
    container_name: uptime-kuma
    restart: unless-stopped
    network_mode: host
    environment:
      UPTIME_KUMA_HOST: 127.0.0.1
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    volumes:
      - uptime-kuma-data:/app/data
volumes:
  uptime-kuma-data:
    external: true
