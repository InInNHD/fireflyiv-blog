# Vaultwarden 密码库（vault.fireflyiv.com → 127.0.0.1:8713）
# 镜像按 sha256 摘要固定（2026-09-01 快照，与服务器现网一致）；升级时替换摘要，见 deploy/README.md「月度升级」
services:
  vaultwarden:
    image: vaultwarden/server@sha256:094b5689ed81549bd293418395c7cf495ae9d960fc2d4928cef2083ef913d912
    container_name: vaultwarden
    restart: unless-stopped
    ports:
      - "127.0.0.1:8713:80"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    environment:
      - DOMAIN=https://vault.fireflyiv.com
      - SIGNUPS_ALLOWED=false
      - SIGNUPS_VERIFY=false
      - WEBSOCKET_ENABLED=true
      - IP_HEADER=CF-Connecting-IP
      - LOGIN_RATELIMIT_SECONDS=60
      - LOGIN_RATELIMIT_MAX_BURST=5
      - UNAUTHENTICATED_RATELIMIT_SECONDS=60
      - UNAUTHENTICATED_RATELIMIT_MAX_BURST=20
      - ADMIN_RATELIMIT_SECONDS=300
      - ADMIN_RATELIMIT_MAX_BURST=3
    volumes:
      - vaultwarden-data:/data
volumes:
  vaultwarden-data:
