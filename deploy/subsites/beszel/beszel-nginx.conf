# Beszel Hub 反代缓冲：修复 PocketBase 对 chunked 请求的 400 问题
# monitor.fireflyiv.com 隧道应指向 127.0.0.1:8707
server {
    listen 127.0.0.1:8707;
    server_name monitor.fireflyiv.com;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=63072000" always;

    location / {
        proxy_pass http://127.0.0.1:8706;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # 缓冲请求体，转发时改为 Content-Length（绕开 chunked）
        proxy_request_buffering on;
        proxy_buffering on;
    }
}
