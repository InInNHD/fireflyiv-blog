# Beszel 服务器监控（monitor.fireflyiv.com → 127.0.0.1:8706）
# 注意：生产环境 hub 已改用二进制 systemd 部署（见 beszel.service），本 compose 仅为容器化备选方案。
# 镜像按 sha256 摘要固定（2026-09-01 快照，与服务器现网一致）；升级时替换摘要，见 deploy/README.md「月度升级」
services:
  beszel:
    image: ghcr.io/henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    ports:
      - "127.0.0.1:8706:8090"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - beszel-data:/beszel_data
  beszel-agent:
    image: ghcr.io/henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    network_mode: host
    pid: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host:ro
    environment:
      PORT: 45876
      KEY: "KEY_PLACEHOLDER"
      FILESYSTEM: /dev/vda2
volumes:
  beszel-data:
